spring.application.name=backend-integrator

# --- Configuración del Servidor Web ---

server.port=${SERVER_PORT:8081}

# --- Configuración de la Base de Datos H2 (Modo Archivo) ---
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=${DB_URL:jdbc:h2:file:~/db/proyecto-db}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Angular, Ionic development and Capacitor native origins. Override for deployment.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8100,http://localhost,https://localhost,capacitor://localhost}
